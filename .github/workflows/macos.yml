name: macOS native app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Check interface translation coverage
        run: python3 scripts/localization-audit.py
      - name: Native tests with synthetic fixtures
        run: swift test --disable-keychain --disable-netrc --package-path native
      - name: Release configuration, packaging and signature fixture tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-embed-sparkle.py
      - name: Check stdio bridge
        run: node --check scripts/mcp-bridge.mjs
      - name: Build development app and App Intents metadata
        run: ./scripts/build-macos.sh
      - name: Verify relocated development app localizations without UI
        run: python3 scripts/verify-localization.py --app build/ClipShelf.app --runtime
      - name: Package development app
        run: ditto -c -k --sequesterRsrc --keepParent build/ClipShelf.app build/ClipShelf-development.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ClipShelf-macOS-development
          path: build/ClipShelf-development.zip
          retention-days: 14

  share-extension-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compile app and embedded Share Extension without signing
        run: >-
          xcodebuild -project native/ClipShelf.xcodeproj -scheme ClipShelf
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/ShareExtensionValidation -packageAuthorizationProvider netrc
          -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
      - name: Verify containing app resources and Sparkle embedding
        run: |
          python3 scripts/verify-localization.py --app build/ShareExtensionValidation/Build/Products/Debug/ClipShelf.app --share-extension --runtime
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          app = Path('build/ShareExtensionValidation/Build/Products/Debug/ClipShelf.app')
          assert (app / 'Contents/PlugIns/ClipShelfShare.appex').is_dir()
          assert (app / 'Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle').is_file()
          assert (app / 'Contents/Resources/Sparkle-LICENSE.txt').read_bytes() == Path('native/Sources/ClipShelf/Sparkle-LICENSE.txt').read_bytes()
          linked = subprocess.check_output(['otool', '-L', str(app / 'Contents/MacOS/ClipShelf')], text=True)
          if '@rpath/ClipShelf.debug.dylib' in linked:
              debug = app / 'Contents/MacOS/ClipShelf.debug.dylib'
              assert debug.is_file()
              linked = subprocess.check_output(['otool', '-L', str(debug)], text=True)
          assert '@rpath/Sparkle.framework/' in linked
          PY
